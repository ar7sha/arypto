[package]
name = "arypto"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
ascon-aead = { version = "0.6.0", features = ["zeroize"] }
base64 = "0.23.1"
blake3 = { version = "1.8.7", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
cipher = { version = "0.5.2", features = ["zeroize"] }
ctr = { version = "0.10.1", features = ["zeroize"] }
hex = "0.4.3"
hmac-sha256 = "1.1.14"
jh = { version = "0.2.0", features = ["zeroize"] }
lattice-slh-dsa = "0.4.0"
memmap = "0.7.0"
memmap2 = "0.9.11"
ml-dsa = { version = "0.1.1", features = ["zeroize"] }
noxtls-crypto = "0.2.20"
rand = "0.10.2"
ring = "0.17.14"
rpassword = "7.5.4" 
serpent = { version = "0.6.0", features = ["zeroize"] }
sha3 = { version = "0.12.0", features = ["zeroize"] }
signature = "3.0.0"
streebog = { version = "0.11.0", features = ["zeroize"] }
threefish = { version = "0.6.0", features = ["zeroize"] }
twofish = { version = "0.8.0", features = ["zeroize"] }
zeroize = "1.9.0"
clap = { version = "4.5", features = ["derive"] }
keyring = { version = "4.2.0", features = ["android-native-keyring-store", "apple-native-keyring-store", "db-keystore", "dbus-secret-service-keyring-store", "linux-keyutils-keyring-store"] }
argon2 = { version = "0.6.0", features = ["kdf", "parallel", "zeroize"] }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "argon"
harness = false

[[bench]]
name = "encrypt"
harness = false
